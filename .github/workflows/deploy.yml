
name: Deploy Web Development Projects

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Assignment 5
        working-directory: assignment-5-Counter
        run: |
          npm ci
          npm run build

      - name: Build Assignment 6
        working-directory: assignment-6-product-cards
        run: |
          npm ci
          npm run build

      - name: Prepare website
        run: |
          mkdir -p site
          cp -r assignment-1-profile assignment-2-product-grid assignment-3-marks-calculator assignment-4-ecommerce site/
          mkdir -p site/assignment-5-Counter
          cp -r assignment-5-Counter/dist/. site/assignment-5-Counter/
          mkdir -p site/assignment-6-product-cards
          cp -r assignment-6-product-cards/dist/. site/assignment-6-product-cards/
          cp README.md site/README.md

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
